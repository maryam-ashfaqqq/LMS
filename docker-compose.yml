services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: oakline-dev
      MYSQL_DATABASE: oakline
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - oakline-mysql:/var/lib/mysql
volumes:
  oakline-mysql:
